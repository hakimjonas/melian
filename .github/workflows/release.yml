name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"
  SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Check style and formatting
        run: sbt check

      - name: Run tests
        run: sbt testAll
        timeout-minutes: 15

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Import GPG key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          if echo "$PGP_SECRET" | grep -q 'BEGIN PGP'; then
            echo "$PGP_SECRET" | gpg --batch --import
          else
            echo "$PGP_SECRET" | base64 -d | gpg --batch --import
          fi
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      - name: Publish signed artifacts to Maven Central
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if curl -sf -o /dev/null "https://repo1.maven.org/maven2/net/ghoula/melian-core_3/${version}/melian-core_3-${version}.pom"; then
            echo "Version ${version} is already published on Maven Central — skipping."
          else
            sbt "+publishSigned; sonaRelease"
          fi
